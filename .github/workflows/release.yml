name: Release

# Driven by the tag, which is what `npm run release` tells you to push.
on:
  push:
    tags: ['v*']

jobs:
  # A tag can point at any commit, and an image published by mistake is far
  # more annoying to withdraw than a workflow re-run. Check before publishing.
  verify:
    runs-on: ubuntu-latest
    # prisma.config.ts resolves env('DATABASE_URL') when the config LOADS, so
    # every prisma command needs it, not just the build. There is no .env in
    # CI to fall back on — which is why this only ever broke here.
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v7

      - name: Read the version out of the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # better-sqlite3 and sharp both ship linuxmusl-arm64 prebuilds, so the
      # arm64 leg downloads binaries rather than compiling under emulation.
      # If this ever gets slow, the upgrade is a matrix over ubuntu-latest and
      # ubuntu-24.04-arm, building per-arch and merging the manifests.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # The build fetches Google Fonts (next/font/google). A red build here is
      # usually that, not the code — re-run it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CHANGELOG.md is the single source of the notes. The script exits 1 if
      # this version has no section, so an empty release is never published.
      - name: Notes from CHANGELOG.md
        run: node scripts/release.mjs --notes "${{ steps.v.outputs.version }}" > notes.md

      - name: Add the pull command
        run: |
          repo="${GITHUB_REPOSITORY,,}"   # GHCR paths are lowercase
          {
            printf '\n## Install\n\n```shell\n'
            printf 'docker pull ghcr.io/%s:%s\n' "$repo" "${{ steps.v.outputs.version }}"
            printf '```\n'
          } >> notes.md

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease

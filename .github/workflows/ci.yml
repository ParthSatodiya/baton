name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # prisma.config.ts resolves env('DATABASE_URL') when the config LOADS, so
    # every prisma command needs it, not just the build. There is no .env in
    # CI to fall back on — which is why this only ever broke here.
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      # A build-time value only; the real URL comes from the environment.
      - run: npm run build

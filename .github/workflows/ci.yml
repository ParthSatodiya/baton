name: CI

# Actions are pinned to a full version tag, which GitHub makes immutable, so
# the ref cannot be repointed later. actions/checkout is the exception: none of
# its releases are immutable, so it is pinned to a commit SHA instead. Dependabot
# updates both forms.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # prisma.config.ts resolves env('DATABASE_URL') when the config LOADS, so
    # every prisma command needs it, not just the build. There is no .env in
    # CI to fall back on — which is why this only ever broke here.
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      # A build-time value only; the real URL comes from the environment.
      - run: npm run build

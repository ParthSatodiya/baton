services:
  relaystand:
    # Pulled by default. `docker compose up -d --build` builds from this
    # checkout instead, which is what you want when working on the code.
    image: ghcr.io/parthsatodiya/relaystand:0.2.0
    build: .
    container_name: relaystand
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Always the volume path inside the container, whatever .env says.
      DATABASE_URL: file:/data/relaystand.db
      # Uploads share the volume, so a rebuild never loses a logo.
      UPLOAD_DIR: /data/uploads
    volumes:
      - relaystand-data:/data

volumes:
  relaystand-data:

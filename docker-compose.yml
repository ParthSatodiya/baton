services:
  baton:
    # Pulled by default. `docker compose up -d --build` builds from this
    # checkout instead, which is what you want when working on the code.
    image: ghcr.io/parthsatodiya/baton:0.4.0
    build: .
    container_name: baton
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Always the volume path inside the container, whatever .env says.
      DATABASE_URL: file:/data/baton.db
      # Uploads share the volume, so a rebuild never loses a logo.
      UPLOAD_DIR: /data/uploads
    volumes:
      - baton-data:/data

volumes:
  baton-data:
